<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SKIPA Chatbot Test</title>
    <link rel="stylesheet" href="/ui/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div>
          <p>SKIPA Chatbot</p>
          <h1>Simple Test UI</h1>
        </div>
        <div class="actions">
          <a href="/docs" target="_blank" rel="noreferrer">Swagger</a>
          <button id="reloadButton" type="button">Reload</button>
        </div>
      </header>

      <section class="status-grid" aria-label="status">
        <article>
          <span>Server</span>
          <strong id="serverStatus">-</strong>
        </article>
        <article>
          <span>Patents</span>
          <strong id="patentCount">-</strong>
        </article>
        <article>
          <span>Vector source</span>
          <strong id="vectorSource">-</strong>
        </article>
        <article>
          <span>Documents</span>
          <strong id="globalDocCount">-</strong>
        </article>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>Audit</h2>
            <span id="auditSummary">No audit loaded</span>
          </div>
          <div class="actions">
            <button id="runAuditButton" type="button">Run</button>
            <button id="loadReviewButton" type="button">Review</button>
            <button id="applyAuditButton" type="button">Apply</button>
          </div>
        </div>

        <div class="form-row">
          <label>
            Audit ID
            <input id="auditIdInput" type="text" placeholder="latest" />
          </label>
          <label>
            Reviewer
            <input id="reviewerInput" type="text" value="demo-user" />
          </label>
        </div>

        <div id="findingList" class="findings">
          <div class="empty">Run audit to load findings.</div>
        </div>

        <details class="review-box">
          <summary>Review Markdown</summary>
          <pre id="reviewMarkdown">No review loaded.</pre>
        </details>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>Query</h2>
            <span id="querySummary">No query sent</span>
          </div>
          <button id="sendQueryButton" type="button">Send</button>
        </div>

        <div class="form-row query-row">
          <label>
            Patent
            <select id="queryPatentSelect"></select>
          </label>
          <label class="query-input">
            Question
            <input id="queryInput" type="text" value="CMP Pad 물류 관리 시스템의 유지 판단 근거" />
          </label>
        </div>

        <div id="queryResults" class="results"></div>
      </section>

      <footer class="footer">
        <span id="message">Ready</span>
        <code id="dataRoot">-</code>
      </footer>
    </main>
    <script src="/ui/static/app.js"></script>
  </body>
</html>
