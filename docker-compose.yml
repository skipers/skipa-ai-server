services:
  eval-logic:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_LOCAL_EMBEDDINGS: ${INSTALL_LOCAL_EMBEDDINGS:-false}
    image: skipa-ai:local
    working_dir: /app/eval_logic
    command:
      - python
      - -m
      - uvicorn
      - apps.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --app-dir
      - /app/eval_logic/src
    environment:
      PYTHONPATH: /app/eval_logic/src:/app
      MPLCONFIGDIR: /tmp/matplotlib
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REPORT_MODEL: ${OPENAI_REPORT_MODEL:-gpt-4.1}
      KOSIS_API_KEY: ${KOSIS_API_KEY:-}
      KIPRIS_API_KEY: ${KIPRIS_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEB_SEARCH_TIMEOUT: ${WEB_SEARCH_TIMEOUT:-20}
    volumes:
      - ./eval_logic/data:/app/eval_logic/data
      - ./chatbot/data:/app/chatbot/data
      - hf-cache:/models/huggingface
    ports:
      - "${EVAL_LOGIC_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  chatbot:
    image: skipa-ai:local
    depends_on:
      eval-logic:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    working_dir: /app
    command:
      - python
      - -m
      - uvicorn
      - chatbot.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      PYTHONPATH: /app:/app/eval_logic/src
      DATA_ROOT: /app/chatbot/data
      SKIPA_DATA_ROOT: /app/chatbot/data
      PATENTS_ROOT: /app/chatbot/data/mapped_patent_reports
      BUSINESS_ROOT: /app/chatbot/data/business
      PATENT_APPLICATION_ROOT: /app/chatbot/data/patent_application_official_pack
      LOG_ROOT: /app/chatbot/logs
      WIKI_AUDITOR_ROOT: /app/chatbot/logs/wiki_auditor
      PUBLIC_FILE_BASE_URL: http://localhost:${CHATBOT_PORT:-8001}/files
      INTENT_PROVIDER: ${INTENT_PROVIDER:-ollama}
      ANSWER_PROVIDER: ${ANSWER_PROVIDER:-openai}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_INTENT_MODEL: ${OPENAI_INTENT_MODEL:-gpt-4.1-mini}
      OPENAI_ANSWER_MODEL: ${OPENAI_ANSWER_MODEL:-gpt-4.1}
      OPENAI_VLM_MODEL: ${OPENAI_VLM_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      OLLAMA_BASE_URL: http://ollama:11434
      GEN_MODEL: ${GEN_MODEL:-qwen2.5:1.5b}
      INTENT_MODEL: ${INTENT_MODEL:-qwen2.5:1.5b}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.0}
      INTENT_LLM_TIMEOUT: ${INTENT_LLM_TIMEOUT:-45}
      ANSWER_LLM_TIMEOUT: ${ANSWER_LLM_TIMEOUT:-180}
      CHATBOT_LLM_TIMEOUT: ${CHATBOT_LLM_TIMEOUT:-45}
      INTENT_NUM_PREDICT: ${INTENT_NUM_PREDICT:-220}
      ANSWER_NUM_PREDICT: ${ANSWER_NUM_PREDICT:-2000}
      TOP_K: ${TOP_K:-10}
      TOP_K_CANDIDATES: ${TOP_K_CANDIDATES:-80}
      MIN_LOCAL_CONFIDENCE: ${MIN_LOCAL_CONFIDENCE:-0.18}
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-true}
      ENABLE_WEB_SEARCH_FALLBACK: ${ENABLE_WEB_SEARCH_FALLBACK:-true}
      WEB_SEARCH_LIMIT: ${WEB_SEARCH_LIMIT:-5}
      WEB_SEARCH_TIMEOUT: ${WEB_SEARCH_TIMEOUT:-20}
      WEB_SEARCH_BLOCKLIST_DOMAINS: ${WEB_SEARCH_BLOCKLIST_DOMAINS:-namu.wiki,blog.naver.com,m.blog.naver.com,tistory.com,wikipedia.org,ko.wikipedia.org}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_API_URL: ${TAVILY_API_URL:-https://api.tavily.com/search}
      TAVILY_SEARCH_DEPTH: ${TAVILY_SEARCH_DEPTH:-advanced}
      TAVILY_TOPIC: ${TAVILY_TOPIC:-general}
      KIPRIS_API_KEY: ${KIPRIS_API_KEY:-}
      KOSIS_API_KEY: ${KOSIS_API_KEY:-}
      RETURN_PERFORMANCE: ${RETURN_PERFORMANCE:-true}
      RAG_QUERY_LOG_PATH: /app/chatbot/logs/rag_query_log.jsonl
    volumes:
      - ./chatbot/data:/app/chatbot/data
      - ./chatbot/logs:/app/chatbot/logs
      - ./eval_logic/data:/app/eval_logic/data
      - hf-cache:/models/huggingface
    ports:
      - "${CHATBOT_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_INTENT_MODEL: ${INTENT_MODEL:-qwen2.5:1.5b}
    entrypoint:
      - /bin/sh
      - -lc
      - |
        echo "Pulling Ollama intent model: $${OLLAMA_INTENT_MODEL}"
        ollama pull "$${OLLAMA_INTENT_MODEL}"
    volumes:
      - ollama-data:/root/.ollama
    restart: "no"

volumes:
  hf-cache:
  ollama-data:
