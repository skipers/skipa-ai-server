name: Nightly Reindex (Wiki + Vectorstore)

on:
  schedule:
    - cron: "0 15 * * *"   # 매일 00:00 KST (UTC 15:00)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-reindex:
    name: Run Nightly Reindex Job
    runs-on: ubuntu-latest

    env:
      REGISTRY: amdp-registry.skala-ai.com
      PROJECT: skala26a-ai2
      IMAGE_NAME: skipa-ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Run nightly reindex
        run: |
          docker run --rm \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            -e TAVILY_API_KEY="${{ secrets.TAVILY_API_KEY }}" \
            -e DATA_ROOT=/app/chatbot/data \
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:main-latest \
            nightly-reindex
