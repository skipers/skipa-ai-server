name: Nightly Reindex (00:00 KST)

on:
  schedule:
    - cron: "0 15 * * *"   # 매일 00:00 KST (UTC 15:00)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-reindex:
    name: Trigger Nightly Reindex via REST API
    runs-on: ubuntu-latest

    steps:
      - name: Call nightly reindex endpoint
        run: |
          curl -X POST "${{ secrets.CHATBOT_API_URL }}/api/v1/chatbot/preprocess/run" \
            -H "Content-Type: application/json" \
            -d '{"mode": "nightly_reindex"}' \
            --fail \
            --silent \
            --show-error
