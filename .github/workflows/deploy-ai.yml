name: Deploy AI Backend

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-update-manifest:
    name: Build, Push, and Update Manifest
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ai-${{ github.ref_name }}
      cancel-in-progress: true

    env:
      REGISTRY: amdp-registry.skala-ai.com
      PROJECT: skala26a-ai2
      IMAGE_NAME: skipa-ai
      INFRA_REPO: skipers/skipa-infra
      INFRA_PATH: k8s/ai-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image variables
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME}
          SAFE_BRANCH=$(echo "${BRANCH}" | tr '/' '-')
          echo "IMAGE_TAG=${SAFE_BRANCH}-${SHORT_SHA}" >> $GITHUB_ENV
          echo "IMAGE_REPOSITORY=${REGISTRY}/${PROJECT}/${IMAGE_NAME}" >> $GITHUB_ENV
          echo "IMAGE=${REGISTRY}/${PROJECT}/${IMAGE_NAME}:${SAFE_BRANCH}-${SHORT_SHA}" >> $GITHUB_ENV
          echo "LATEST_IMAGE=${REGISTRY}/${PROJECT}/${IMAGE_NAME}:${SAFE_BRANCH}-latest" >> $GITHUB_ENV

      - name: Show deployment target
        run: |
          echo "Image: ${IMAGE}"
          echo "Latest alias: ${LATEST_IMAGE}"
          echo "Infra path: ${INFRA_REPO}/${INFRA_PATH}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            INSTALL_LOCAL_EMBEDDINGS=false
          tags: |
            ${{ env.IMAGE }}
            ${{ env.LATEST_IMAGE }}

      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: skipa-infra

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update image tag in kustomization
        working-directory: skipa-infra/${{ env.INFRA_PATH }}
        run: |
          if [ ! -f kustomization.yml ] && [ ! -f kustomization.yaml ]; then
            echo "Cannot find kustomization.yml or kustomization.yaml in ${INFRA_PATH}" >&2
            exit 1
          fi
          kustomize edit set image "${IMAGE_REPOSITORY}=${IMAGE_REPOSITORY}:${IMAGE_TAG}"

      - name: Commit and push manifest update to infra repository
        run: |
          cd skipa-infra

          if git diff --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ env.INFRA_PATH }}/kustomization.yml" "${{ env.INFRA_PATH }}/kustomization.yaml" 2>/dev/null || true
          git commit -m "ci: update ai-backend image tag to ${IMAGE_TAG} [skip ci]"
          git push origin main
