name: Deploy AI Backend

on:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: "0 15 * * *"   # 매일 00:00 KST (UTC 15:00) — nightly reindex
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-update-manifest:
    name: Build, Push, and Update Manifest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      REGISTRY: amdp-registry.skala-ai.com
      PROJECT: skala26a-ai2
      IMAGE_NAME: skipa-ai
      INFRA_REPO: skipers/skipa-infra
      INFRA_PATH: k8s/ai-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image variables
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME}
          echo "IMAGE_TAG=${BRANCH}-${SHORT_SHA}" >> $GITHUB_ENV
          echo "IMAGE_REPOSITORY=${REGISTRY}/${PROJECT}/${IMAGE_NAME}" >> $GITHUB_ENV
          echo "IMAGE=${REGISTRY}/${PROJECT}/${IMAGE_NAME}:${BRANCH}-${SHORT_SHA}" >> $GITHUB_ENV
          echo "LATEST_IMAGE=${REGISTRY}/${PROJECT}/${IMAGE_NAME}:${BRANCH}-latest" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ env.LATEST_IMAGE }}

      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: skipa-infra

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update image tag in kustomization
        working-directory: skipa-infra/${{ env.INFRA_PATH }}
        run: |
          kustomize edit set image "${IMAGE_REPOSITORY}=${IMAGE_REPOSITORY}:${IMAGE_TAG}"

      - name: Commit and push manifest update to infra repository
        run: |
          cd skipa-infra

          if git diff --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ env.INFRA_PATH }}/kustomization.yml"
          git commit -m "ci: update ai-backend image tag to ${IMAGE_TAG} [skip ci]"
          git push origin main

  nightly-reindex:
    name: Nightly Reindex (00:00 KST)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Call nightly reindex endpoint
        run: |
          curl -X POST "${{ secrets.CHATBOT_API_URL }}/api/v1/chatbot/preprocess/run" \
            -H "Content-Type: application/json" \
            -d '{"mode": "nightly_reindex"}' \
            --fail \
            --silent \
            --show-error
