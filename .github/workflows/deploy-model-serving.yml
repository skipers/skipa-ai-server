name: Deploy Model Serving

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - scripts/serve_llm_cpu.py
      - scripts/serve_embedding.py
      - chatbot/requirements.txt
      - eval_logic/requirements.txt
      - ai-insights/requirements.txt
      - .github/workflows/deploy-model-serving.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Model Serving Image
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-model-serving-${{ github.ref_name }}
      cancel-in-progress: true

    env:
      REGISTRY: amdp-registry.skala-ai.com
      PROJECT: skala26a-ai2
      IMAGE_NAME: skipa-model-serving

    steps:
      - name: Checkout AI repository
        uses: actions/checkout@v4

      - name: Set image variables
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "IMAGE_TAG=dev-${SHORT_SHA}" >> $GITHUB_ENV
          echo "IMAGE=${REGISTRY}/${PROJECT}/${IMAGE_NAME}:dev-${SHORT_SHA}" >> $GITHUB_ENV
          echo "LATEST_IMAGE=${REGISTRY}/${PROJECT}/${IMAGE_NAME}:dev-latest" >> $GITHUB_ENV

      - name: Show image target
        run: |
          echo "Image: ${IMAGE}"
          echo "Latest alias: ${LATEST_IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            INSTALL_LOCAL_EMBEDDINGS=true
          tags: |
            ${{ env.IMAGE }}
            ${{ env.LATEST_IMAGE }}
