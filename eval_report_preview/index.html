<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eval Logic Report JSON Preview</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --line: #dfe5ee;
      --text: #162033;
      --muted: #64748b;
      --blue: #2563eb;
      --green: #16794c;
      --amber: #9a6700;
      --red: #b42318;
      --violet: #6554c0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 22px 28px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    main { padding: 24px 28px 48px; max-width: 1440px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 0; }
    h2 { margin: 0 0 16px; font-size: 18px; }
    h3 { margin: 0 0 10px; font-size: 15px; }
    .muted { color: var(--muted); }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto auto;
      gap: 10px;
      margin-top: 16px;
      align-items: center;
    }
    input, select, button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 0 12px;
      font: inherit;
    }
    button {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
      font-weight: 700;
      cursor: pointer;
    }
    section {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 18px;
    }
    .hero {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 18px;
      align-items: stretch;
    }
    .meta-grid, .score-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .meta-item, .score-item, .issue-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--surface-soft);
      min-width: 0;
    }
    .label { color: var(--muted); font-size: 12px; font-weight: 700; margin-bottom: 4px; }
    .value { font-weight: 750; overflow-wrap: anywhere; }
    .big-grade {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 170px;
      border-radius: 8px;
      background: #eef2ff;
      color: var(--violet);
      font-size: 76px;
      font-weight: 850;
      line-height: 1;
    }
    .score-number { font-size: 26px; font-weight: 850; line-height: 1; }
    .score-bar { height: 7px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-top: 10px; }
    .score-fill { height: 100%; width: 0; background: var(--blue); border-radius: 99px; }
    .opinion {
      white-space: pre-wrap;
      background: #f8fbff;
      border-left: 4px solid var(--blue);
      padding: 14px 16px;
      border-radius: 0 8px 8px 0;
    }
    .dimension { margin-top: 18px; }
    .dimension-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: #1f2937;
      color: white;
      border-radius: 8px 8px 0 0;
      font-weight: 800;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-top: 0;
      background: var(--surface);
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th {
      color: var(--muted);
      background: var(--surface-soft);
      font-size: 12px;
      font-weight: 800;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 9px;
      background: #eef2ff;
      color: var(--violet);
      font-weight: 800;
      white-space: nowrap;
    }
    .risk-high, .severity-high { background: #fef3f2; color: var(--red); }
    .risk-medium, .severity-medium { background: #fffbeb; color: var(--amber); }
    .risk-low, .severity-low { background: #ecfdf3; color: var(--green); }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 18px;
      background: var(--surface-soft);
    }
    details {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }
    summary {
      cursor: pointer;
      padding: 12px 14px;
      font-weight: 800;
      background: var(--surface-soft);
    }
    pre {
      margin: 0;
      padding: 14px;
      overflow: auto;
      max-height: 520px;
      font-size: 12px;
      line-height: 1.5;
    }
    .error {
      border-color: #fda29b;
      background: #fff4f3;
      color: var(--red);
    }
    @media (max-width: 900px) {
      header, main { padding-left: 16px; padding-right: 16px; }
      .toolbar, .hero, .split, .meta-grid, .score-grid { grid-template-columns: 1fr; }
      .big-grade { min-height: 120px; font-size: 56px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Eval Logic Report JSON Preview</h1>
    <div class="muted">eval_logic 평가 보고서 JSON을 프론트에서 바로 파싱해 렌더링한 확인용 화면입니다.</div>
    <div class="toolbar">
      <input id="jsonPath" aria-label="JSON path" value="eval_logic/data/api_test/output/reports/10-2925867.json">
      <select id="sampleSelect" aria-label="sample report">
        <option value="eval_logic/data/api_test/output/reports/10-1959619.json">api_test 10-1959619</option>
        <option value="eval_logic/data/api_test/output/reports/10-2925867.json">api_test 10-2925867</option>
        <option value="eval_logic/data/api_test/output/reports/20260529_145927_10-2042318_job_20260529_145534_f316ffa6.json">api_test 10-2042318</option>
        <option value="eval_logic/data/runtime_artifacts/reports/10-2925867.json">runtime 10-2925867</option>
      </select>
      <button id="loadButton" type="button">Load</button>
    </div>
  </header>
  <main id="app"></main>
  <script>
    const app = document.querySelector("#app");
    const input = document.querySelector("#jsonPath");
    const select = document.querySelector("#sampleSelect");
    const loadButton = document.querySelector("#loadButton");

    const params = new URLSearchParams(location.search);
    if (params.get("file")) input.value = params.get("file");
    select.addEventListener("change", () => {
      input.value = select.value;
      loadReport();
    });
    loadButton.addEventListener("click", loadReport);

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function asList(value) {
      if (Array.isArray(value)) return value.filter(Boolean);
      if (value === null || value === undefined || value === "") return [];
      return [value];
    }

    function scoreColor(score) {
      const n = Number(score || 0);
      if (n >= 80) return "var(--green)";
      if (n >= 60) return "var(--blue)";
      if (n >= 40) return "var(--amber)";
      return "var(--red)";
    }

    function unwrapReport(data) {
      return data?.result?.report || data?.report || data;
    }

    function unwrapWorkflow(data) {
      return data?.result || data;
    }

    function candidatePaths(path) {
      const cleaned = path.replace(/^\/+/, "");
      const candidates = [cleaned];
      const legacyOutput = "eval_logic/data/output/reports/";
      const apiTestOutput = "eval_logic/data/api_test/output/reports/";
      const runtimeOutput = "eval_logic/data/runtime_artifacts/reports/";
      if (cleaned.startsWith(legacyOutput)) {
        const filename = cleaned.slice(legacyOutput.length);
        candidates.push(apiTestOutput + filename, runtimeOutput + filename);
      }
      if (/^10-\d+\.json$/.test(cleaned) || /^\d{8}_.*\.json$/.test(cleaned)) {
        candidates.push(apiTestOutput + cleaned, runtimeOutput + cleaned);
      }
      return [...new Set(candidates)];
    }

    async function fetchFirstJson(path) {
      const errors = [];
      for (const candidate of candidatePaths(path)) {
        const fetchPath = candidate.startsWith("http")
          ? candidate
          : "/" + candidate.replace(/^\/+/, "");
        try {
          const response = await fetch(fetchPath, { cache: "no-store" });
          if (!response.ok) {
            errors.push(`${fetchPath}: ${response.status} ${response.statusText}`);
            continue;
          }
          return { data: await response.json(), resolvedPath: candidate };
        } catch (error) {
          errors.push(`${fetchPath}: ${error.message}`);
        }
      }
      throw new Error(errors.join("\n"));
    }

    async function loadReport() {
      const path = input.value.trim();
      history.replaceState(null, "", `?file=${encodeURIComponent(path)}`);
      app.innerHTML = `<section><h2>Loading</h2><div class="muted">${escapeHtml(path)}</div></section>`;
      try {
        const { data, resolvedPath } = await fetchFirstJson(path);
        input.value = resolvedPath;
        render(data, resolvedPath);
      } catch (error) {
        app.innerHTML = `<section class="error"><h2>JSON 로드 실패</h2><pre>${escapeHtml(error.message)}</pre><p class="muted">실제 기본 경로는 eval_logic/data/api_test/output/reports/ 또는 eval_logic/data/runtime_artifacts/reports/ 입니다.</p></section>`;
      }
    }

    function render(data, path) {
      const report = unwrapReport(data);
      const workflow = unwrapWorkflow(data);
      const patent = report.patent || {};
      const summary = report.section_1_summary || {};
      const detail = report.section_2_detailed_scores || {};
      const project = report.section_3_project_utilization || {};
      const similar = report.section_4_similar_patents || {};
      const review = report.section_5_review_items || {};
      const references = report.section_6_references || {};
      const qa = report.quality_assurance || workflow.report_verification || {};
      const dims = summary.dimension_scores || {};
      const overallScore = summary.overall_score_out_of_100 ?? Math.round((summary.overall_score || 0) * 20);

      app.innerHTML = `
        ${renderHero(path, patent, summary, overallScore, workflow)}
        ${renderSummary(summary, dims)}
        ${renderDetailedScores(detail)}
        ${renderProject(project)}
        ${renderSimilar(similar)}
        ${renderReview(review, qa)}
        ${renderReferences(references)}
        ${renderRaw(data)}
      `;
    }

    function renderHero(path, patent, summary, overallScore, workflow) {
      return `
        <section class="hero">
          <div>
            <div class="muted">Source JSON: ${escapeHtml(path)}</div>
            <h2>${escapeHtml(patent.title || "제목 없음")}</h2>
            <div class="meta-grid">
              ${meta("특허번호", patent.registration_number || patent.id)}
              ${meta("출원번호", patent.application_number)}
              ${meta("출원일", patent.application_date)}
              ${meta("등록일", patent.registration_date)}
              ${meta("IPC", asList(patent.ipc_codes).join(", "))}
              ${meta("CPC", asList(patent.cpc_codes).join(", "))}
              ${meta("권리자", asList(patent.assignee).join(", "))}
              ${meta("청구항 수", patent.total_claims)}
            </div>
          </div>
          <div>
            <div class="big-grade">${escapeHtml(summary.overall_grade || "-")}</div>
            <div class="score-item" style="margin-top: 10px;">
              <div class="label">종합 점수</div>
              <div class="score-number">${escapeHtml(overallScore ?? "-")} / 100</div>
              <div class="score-bar"><div class="score-fill" style="width:${Number(overallScore || 0)}%; background:${scoreColor(overallScore)}"></div></div>
              <div class="muted" style="margin-top:8px;">workflow: ${escapeHtml(workflow.status || "-")}</div>
            </div>
          </div>
        </section>
      `;
    }

    function renderSummary(summary, dims) {
      const scoreCards = Object.entries(dims).map(([name, value]) => `
        <div class="score-item">
          <div class="label">${escapeHtml(name)}</div>
          <div class="score-number">${escapeHtml(value.score_out_of_100 ?? "-")} / 100</div>
          <div class="muted">평균 ${escapeHtml(value.average_score ?? "-")} / 5 · ${escapeHtml(value.grade ?? "-")}</div>
          <div class="score-bar"><div class="score-fill" style="width:${Number(value.score_out_of_100 || 0)}%; background:${scoreColor(value.score_out_of_100)}"></div></div>
        </div>
      `).join("");
      return `
        <section>
          <h2>평가 요약</h2>
          <div class="score-grid">${scoreCards || `<div class="empty">차원별 점수 없음</div>`}</div>
          <h3 style="margin-top:18px;">종합 의견</h3>
          <div class="opinion">${escapeHtml(summary.overall_opinion || "종합 의견 없음")}</div>
        </section>
      `;
    }

    function renderDetailedScores(detail) {
      const dimensions = detail.dimensions || {};
      const blocks = Object.entries(dimensions).map(([name, dim]) => {
        const rows = asList(dim.items).map(item => `
          <tr>
            <td><strong>${escapeHtml(item.item)}</strong></td>
            <td><span class="pill">${escapeHtml(item.score_out_of_100 ?? item.score ?? "-")}</span></td>
            <td>${escapeHtml(item.method || "-")}</td>
            <td>${escapeHtml(item.judgment_summary || item.judgment_basis || "-")}</td>
            <td>${escapeHtml(item.confidence || "-")}</td>
          </tr>
        `).join("");
        return `
          <div class="dimension">
            <div class="dimension-head">
              <span>${escapeHtml(name)}</span>
              <span>${escapeHtml(dim.score_out_of_100 ?? "-")} / 100</span>
            </div>
            <table>
              <thead><tr><th>항목</th><th>점수</th><th>방식</th><th>판단 요지</th><th>신뢰도</th></tr></thead>
              <tbody>${rows || `<tr><td colspan="5">항목 없음</td></tr>`}</tbody>
            </table>
          </div>
        `;
      }).join("");
      return `<section><h2>평가 기준별 상세 점수</h2>${blocks || `<div class="empty">상세 점수 없음</div>`}</section>`;
    }

    function renderProject(project) {
      const sources = asList(project.sources).map(source => `<li>${escapeHtml(source.title || source.name || source.url || JSON.stringify(source))}</li>`).join("");
      return `
        <section>
          <h2>사내 프로젝트 활용 현황</h2>
          ${project.available === false ? `<div class="empty">${escapeHtml(project.answer || "사내 프로젝트/RAG 근거가 없습니다.")}</div>` : ""}
          <div class="split">
            ${metaBlock("사업화 상태", project.commercialization_status)}
            ${metaBlock("적용 서비스", project.applied_business_service)}
          </div>
          <h3 style="margin-top:16px;">요약</h3>
          <div class="opinion">${escapeHtml(project.project_summary || project.answer || "내용 없음")}</div>
          ${sources ? `<h3 style="margin-top:16px;">Sources</h3><ul>${sources}</ul>` : ""}
        </section>
      `;
    }

    function renderSimilar(similar) {
      const patents = asList(similar.patent_list || similar.top_comparisons);
      const rows = patents.slice(0, 12).map(item => `
        <tr>
          <td>${escapeHtml(item.title || item.patent_title || item.name || "-")}</td>
          <td>${escapeHtml(item.registration_number || item.application_number || item.patent_id || "-")}</td>
          <td>${escapeHtml(item.legal_status || item.status || "-")}</td>
          <td>${escapeHtml(item.similarity_score || item.score || "-")}</td>
        </tr>
      `).join("");
      return `
        <section>
          <h2>유사 특허 분석</h2>
          ${similar.available === false ? `<div class="empty">${escapeHtml(similar.message || "유사 특허 분석 데이터가 없습니다.")}</div>` : ""}
          <table>
            <thead><tr><th>제목</th><th>번호</th><th>상태</th><th>유사도</th></tr></thead>
            <tbody>${rows || `<tr><td colspan="4">표시할 유사 특허 없음</td></tr>`}</tbody>
          </table>
        </section>
      `;
    }

    function renderReview(review, qa) {
      const items = asList(review.items);
      const issues = asList(qa.issues);
      const reviewItems = items.map(item => `
        <div class="issue-item">
          <div><strong>${escapeHtml(item.item)}</strong> <span class="pill severity-${escapeHtml(item.review_priority || "medium")}">${escapeHtml(item.review_priority || "medium")}</span></div>
          <div class="muted">${escapeHtml(item.selection_reason || "")}</div>
          <div>${escapeHtml(item.required_evidence || item.judgment_basis || "")}</div>
        </div>
      `).join("");
      const issueRows = issues.map(issue => `
        <tr>
          <td><span class="pill severity-${escapeHtml(issue.severity || "medium")}">${escapeHtml(issue.severity || "-")}</span></td>
          <td>${escapeHtml(issue.code || "-")}</td>
          <td>${escapeHtml(issue.message || "-")}</td>
          <td>${escapeHtml(issue.location || "-")}</td>
        </tr>
      `).join("");
      return `
        <section>
          <h2>추가 확인 및 검증</h2>
          <div class="split">
            ${metaBlock("신뢰도 등급", qa.reliability_grade)}
            ${metaBlock("위험 수준", qa.risk_level)}
          </div>
          <h3 style="margin-top:16px;">추가 확인 항목</h3>
          <div class="score-grid">${reviewItems || `<div class="empty">추가 확인 항목 없음</div>`}</div>
          <h3 style="margin-top:16px;">검증 이슈</h3>
          <table>
            <thead><tr><th>심각도</th><th>코드</th><th>메시지</th><th>위치</th></tr></thead>
            <tbody>${issueRows || `<tr><td colspan="4">검증 이슈 없음</td></tr>`}</tbody>
          </table>
        </section>
      `;
    }

    function renderReferences(references) {
      const refs = asList(references.references || references.items || references.sources);
      const rows = refs.map((ref, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>${escapeHtml(ref.title || ref.name || ref.url || JSON.stringify(ref))}</td>
          <td>${ref.url ? `<a href="${escapeHtml(ref.url)}" target="_blank" rel="noreferrer">${escapeHtml(ref.url)}</a>` : "-"}</td>
        </tr>
      `).join("");
      return `
        <section>
          <h2>참고 문헌</h2>
          <table>
            <thead><tr><th>No.</th><th>제목</th><th>URL</th></tr></thead>
            <tbody>${rows || `<tr><td colspan="3">참고 문헌 없음</td></tr>`}</tbody>
          </table>
        </section>
      `;
    }

    function renderRaw(data) {
      return `
        <section>
          <details>
            <summary>Raw JSON 보기</summary>
            <pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>
          </details>
        </section>
      `;
    }

    function meta(label, value) {
      return `<div class="meta-item"><div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(value || "-")}</div></div>`;
    }

    function metaBlock(label, value) {
      return `<div class="meta-item"><div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(value || "-")}</div></div>`;
    }

    loadReport();
  </script>
</body>
</html>
